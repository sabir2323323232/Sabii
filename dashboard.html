
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sabii Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.hidden{display:none!important}
*{box-sizing:border-box}
body{margin:0;padding-bottom:100px;font-family:Arial,sans-serif;background:#faf7f1;color:#292524;overflow-x:hidden}
.gold{color:#a37f38}
.card{background:white;border:1px solid #e8d9bb;border-radius:18px;box-shadow:0 5px 18px #a37f3810}
.btn{background:linear-gradient(120deg,#c5a059,#a37f38);color:white}
.muted{color:#78716c}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:0;border-radius:12px;font-size:9px;font-weight:bold;padding:9px 2px;animation:float 3s ease-in-out infinite}
.nav-item i{font-size:17px}
.nav-item:nth-child(2){animation-delay:.2s}
.nav-item:nth-child(3){animation-delay:.4s}
.nav-item:nth-child(4){animation-delay:.6s}
.nav-item:nth-child(5){animation-delay:.8s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.how-btn{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #c5a05955}50%{box-shadow:0 0 0 8px #c5a05900}}
@media(max-width:640px){
body{padding-bottom:100px}
main{padding:12px!important}
.nav-item{font-size:8px;min-height:55px}
.nav-item i{font-size:16px}
}
@media(max-width:360px){
.nav-item{font-size:7px}
.nav-item i{font-size:14px}
}
@media(prefers-reduced-motion:reduce){
*{animation:none!important}
}
</style>
</head>

<body>

<header class="sticky top-0 z-30 bg-white border-b border-amber-200">
 <div class="max-w-6xl mx-auto px-3 h-16 flex items-center justify-between">

  <div class="flex items-center gap-2">
   <span class="w-10 h-10 rounded-xl btn flex items-center justify-center text-xl font-bold">S</span>
   <span>
    <b class="text-xl gold">Sabii</b>
    <small class="block text-[9px]">MEMBER DASHBOARD</small>
   </span>
  </div>

  <div class="flex items-center gap-3">
   <button id="howOpen" class="how-btn rounded-full bg-amber-50 border border-amber-200 text-amber-800 w-9 h-9" aria-label="Dashboard information">
    <i class="fa-solid fa-circle-info"></i>
   </button>

   <span id="userName" class="text-xs font-bold">Loading...</span>

   <button id="logout" class="text-red-500" aria-label="Logout">
    <i class="fa-solid fa-right-from-bracket"></i>
   </button>
  </div>

 </div>
</header>

<main class="max-w-6xl mx-auto p-4 space-y-4">

 <div class="card p-4 flex justify-between items-center">
  <div>
   <p class="text-xs muted">Available wallet balance</p>
   <strong id="wallet" class="text-2xl gold">Rs 0.00</strong>
  </div>

  <i class="fa-solid fa-wallet text-3xl gold"></i>
 </div>

</main>

<!-- Bottom Navigation -->
<nav class="fixed bottom-0 inset-x-0 z-40 bg-white border-t border-amber-200">
 <div class="max-w-6xl mx-auto grid grid-cols-5 gap-1 p-2 text-center">

  <a href="payment.html" class="nav-item text-emerald-700">
   <i class="fa-solid fa-credit-card"></i>
   Payment
  </a>

  <a href="gmail-selling.html" class="nav-item text-sky-700">
   <i class="fa-solid fa-envelope"></i>
   Gmail Rs 50
  </a>

  <a href="referral.html" class="nav-item text-orange-700">
   <i class="fa-solid fa-users"></i>
   Referral Rs 50
  </a>

  <a href="help-centre.html" class="nav-item text-rose-700">
   <i class="fa-solid fa-headset"></i>
   Help
  </a>

  <a href="task.html" class="nav-item text-amber-800 bg-amber-50">
   <i class="fa-solid fa-list-check"></i>
   Tasks Rs 1
  </a>

 </div>
</nav>

<div id="toast" class="hidden fixed top-20 right-4 z-[90] bg-stone-900 text-white p-3 rounded-xl text-xs"></div>

<script type="module">

import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';

import {
 getAuth,
 onAuthStateChanged,
 signOut
} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

import {
 getDatabase,
 ref,
 onValue
} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';


const firebaseConfig={
 apiKey:'AIzaSyC0ufsDkglGIXuU8Tj3wg4-yexoI6oxBm4',
 authDomain:'sabi-3ea84.firebaseapp.com',
 databaseURL:'https://sabi-3ea84-default-rtdb.firebaseio.com',
 projectId:'sabi-3ea84',
 storageBucket:'sabi-3ea84.firebasestorage.app',
 messagingSenderId:'124632688151',
 appId:'1:124632688151:web:b4804b0cc7f301d30d9e52'
};


const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

const $=id=>document.getElementById(id);

const money=n=>'Rs '+Number(n||0).toLocaleString('en-PK',{
 minimumFractionDigits:2,
 maximumFractionDigits:2
});


function toast(message){

 const el=$('toast');

 el.textContent=message;

 el.classList.remove('hidden');

 setTimeout(()=>{
  el.classList.add('hidden');
 },3500);

}


$('howOpen').onclick=()=>{
 toast('Welcome to your Sabii dashboard. Use the buttons below to open services.');
};


onAuthStateChanged(auth,user=>{

 if(!user){

  $('userName').textContent='Login required';

  location.href='index.html';

  return;

 }

 $('userName').textContent=user.displayName||user.email||'Member';


 onValue(ref(db,`users/${user.uid}`),snapshot=>{

  const data=snapshot.val()||{};

  $('wallet').textContent=money(data.balance||0);

 },error=>toast('Wallet error: '+error.message));

});


$('logout').onclick=async()=>{

 try{

  await signOut(auth);

  location.href='index.html';

 }catch(error){

  toast(error.message||'Logout failed');

 }

};

</script>

</body>
</html>
