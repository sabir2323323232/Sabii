<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabii - Simple Task Earning Portal</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sabii: {
              gold: '#C5A059',
              lightgold: '#E5D3B3',
              darkgold: '#A37F38',
              accent: '#D4AF37',
              bg: '#FFFFFF',
            }
          },
          fontFamily: {
            brand: ['Cormorant Garamond', 'serif'],
            sans: ['Montserrat', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #FFFFFF;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
    }

    .sabii-card {
      background: #FFFFFF;
      border: 1px solid rgba(197, 160, 89, 0.2);
      box-shadow: 0 10px 30px rgba(197, 160, 89, 0.05);
    }

    .sabii-gold-text {
      background: linear-gradient(135deg, #A37F38 0%, #C5A059 50%, #D4AF37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sabii-button {
      background: linear-gradient(135deg, #C5A059 0%, #D4AF37 50%, #A37F38 100%);
      background-size: 200% auto;
      transition: all 0.3s ease;
      color: #FFFFFF;
    }

    .sabii-button:hover {
      background-position: right center;
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(197, 160, 89, 0.3);
    }

    .sabii-input {
      background: #FFFFFF;
      border: 1px solid rgba(197, 160, 89, 0.3);
      transition: all 0.3s ease;
    }

    .sabii-input:focus {
      border-color: #C5A059;
      box-shadow: 0 0 8px rgba(197, 160, 89, 0.25);
      outline: none;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #FFFFFF; }
    ::-webkit-scrollbar-thumb { background: #C5A059; border-radius: 10px; }
  </style>
</head>
<body class="flex flex-col min-h-screen relative overflow-x-hidden text-stone-800">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none"></div>

  <!-- Submit Proof Modal -->
  <div id="proof-modal" class="fixed inset-0 z-50 bg-stone-900/40 backdrop-blur-sm flex items-center justify-center hidden p-4">
    <div class="sabii-card max-w-md w-full rounded-2xl p-6 space-y-4 bg-white shadow-2xl relative animate-fade-in">
      <div class="flex items-center justify-between border-b border-stone-100 pb-3">
        <h3 class="text-base font-bold text-stone-800 font-brand flex items-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up text-sabii-gold"></i> Submit Task Proof
        </h3>
        <button onclick="closeProofModal()" class="w-8 h-8 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-600 flex items-center justify-center transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="proof-form" onsubmit="submitTaskProof(event)" class="space-y-3.5">
        <input type="hidden" id="modal-task-id">
        <input type="hidden" id="modal-task-reward">
        <input type="hidden" id="modal-task-name">

        <div>
          <label class="block text-xs font-semibold text-stone-700 mb-1">Task Name: <span id="display-task-name" class="text-sabii-darkgold font-bold"></span></label>
          <p class="text-[11px] text-stone-400">Task complete karne ka screenshot upload karein.</p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-stone-700 mb-1">Screenshot Proof (Gallery se)</label>
          <input type="file" id="proof-file" accept="image/*" required class="w-full px-3 py-2 rounded-xl text-xs sabii-input text-stone-800 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-sabii-gold/10 file:text-sabii-darkgold hover:file:bg-sabii-gold/20">
        </div>

        <button type="submit" id="modal-submit-btn" class="w-full py-3 rounded-xl sabii-button font-bold text-xs uppercase tracking-wider flex items-center justify-center gap-2">
          <span>Submit Proof for Review</span>
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-white border-b border-sabii-gold/15 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between">
      <a href="dashboard.html" class="flex items-center gap-2 sm:gap-3">
        <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-sabii-gold/10 border border-sabii-gold/30 flex items-center justify-center text-sabii-darkgold">
          <span class="font-brand font-bold text-lg sm:text-xl">S</span>
        </div>
        <div>
          <span class="font-brand text-xl sm:text-3xl font-bold sabii-gold-text tracking-wider block leading-none">Sabii</span>
          <span class="text-[8px] sm:text-[9px] text-stone-400 font-semibold uppercase tracking-widest">Simple Tasks Portal</span>
        </div>
      </a>

      <!-- Back to Dashboard -->
      <a href="dashboard.html" class="py-1.5 px-3 rounded-xl border border-sabii-gold/30 text-sabii-darkgold bg-sabii-gold/10 hover:bg-sabii-gold hover:text-white transition-all text-xs font-bold flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left"></i> Dashboard
      </a>
    </div>
  </header>

  <!-- Main Area -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- Category Buttons Bar -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <button onclick="switchCategory('social')" id="cat-social-btn" class="py-3 px-3 rounded-2xl border-2 border-sabii-gold bg-sabii-gold/10 text-sabii-darkgold font-bold text-xs sm:text-sm flex flex-col items-center gap-1 transition shadow-sm">
        <i class="fa-solid fa-share-nodes text-base"></i>
        <span>Social Task</span>
        <span class="text-[10px] text-emerald-700 font-bold bg-emerald-100 px-2 py-0.5 rounded-full">Rs 0.10</span>
      </button>

      <button onclick="switchCategory('download')" id="cat-download-btn" class="py-3 px-3 rounded-2xl border border-sabii-gold/30 bg-white text-stone-600 font-bold text-xs sm:text-sm flex flex-col items-center gap-1 transition shadow-sm hover:bg-stone-50">
        <i class="fa-solid fa-download text-base"></i>
        <span>Download Task</span>
        <span class="text-[10px] text-emerald-700 font-bold bg-emerald-100 px-2 py-0.5 rounded-full">Rs 0.30</span>
      </button>

      <button onclick="switchCategory('video')" id="cat-video-btn" class="py-3 px-3 rounded-2xl border border-sabii-gold/30 bg-white text-stone-600 font-bold text-xs sm:text-sm flex flex-col items-center gap-1 transition shadow-sm hover:bg-stone-50">
        <i class="fa-solid fa-video text-base"></i>
        <span>Video Watch</span>
        <span class="text-[10px] text-emerald-700 font-bold bg-emerald-100 px-2 py-0.5 rounded-full">Rs 0.15</span>
      </button>

      <button onclick="switchCategory('full')" id="cat-full-btn" class="py-3 px-3 rounded-2xl border border-sabii-gold/30 bg-white text-stone-600 font-bold text-xs sm:text-sm flex flex-col items-center gap-1 transition shadow-sm hover:bg-stone-50">
        <i class="fa-solid fa-star-badge text-base"></i>
        <span>Full Task</span>
        <span class="text-[10px] text-emerald-700 font-bold bg-emerald-100 px-2 py-0.5 rounded-full">Rs 0.50</span>
      </button>
    </div>

    <!-- Tasks Display Section -->
    <div class="space-y-4">
      <div class="flex items-center justify-between border-b border-stone-100 pb-2">
        <h3 id="current-category-title" class="text-base font-bold font-brand text-stone-800 uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-list-check text-sabii-gold"></i> Social Tasks List
        </h3>
        <span class="text-[10px] text-sabii-darkgold font-bold bg-sabii-gold/10 px-2.5 py-1 rounded-full">Live Synced from Admin</span>
      </div>

      <!-- Tasks Grid Container -->
      <div id="tasks-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="col-span-full sabii-card rounded-2xl p-8 text-center text-stone-400 text-xs">
          Loading tasks...
        </div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="p-3 text-center border-t border-stone-100 bg-white text-[10px] text-stone-400 mt-auto">
    &copy; Sabii Application. Powered by Firebase Realtime Database.
  </footer>

  <!-- Firebase Scripts & Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getDatabase, 
      ref, 
      set, 
      push, 
      onValue,
      get,
      update 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyC0ufsDkglGIXuU8Tj3wg4-yexoI6oxBm4",
      authDomain: "sabi-3ea84.firebaseapp.com",
      projectId: "sabi-3ea84",
      storageBucket: "sabi-3ea84.firebasestorage.app",
      messagingSenderId: "124632688151",
      appId: "1:124632688151:web:b4804b0cc7f301d30d9e52",
      measurementId: "G-837LHT24Y3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUserId = null;
    let activeCategory = 'social';
    let allTasksData = {};
    let processedApprovals = new Set(); // Prevent double crediting

    // Toast Alert Function
    window.showToast = function(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      const bgColor = type === 'success' 
        ? 'bg-stone-900 border-sabii-gold text-sabii-lightgold' 
        : 'bg-red-900 border-red-500 text-white';

      toast.className = `p-3.5 rounded-xl border ${bgColor} shadow-xl text-xs font-semibold flex items-center justify-between gap-3 pointer-events-auto transform translate-y-[-10px] opacity-0 transition-all duration-300`;
      
      const icon = type === 'success' ? '<i class="fa-solid fa-circle-check text-sabii-gold text-base"></i>' : '<i class="fa-solid fa-triangle-exclamation text-red-400 text-base"></i>';

      toast.innerHTML = `
        <div class="flex items-center gap-2">
          ${icon}
          <span>${message}</span>
        </div>
        <button onclick="this.parentElement.remove()" class="opacity-70 hover:opacity-100"><i class="fa-solid fa-xmark"></i></button>
      `;

      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.remove('translate-y-[-10px]', 'opacity-0');
      }, 10);

      setTimeout(() => {
        toast.classList.add('opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    };

    // Category Switcher
    window.switchCategory = function(cat) {
      activeCategory = cat;
      
      // Reset all buttons styling
      ['social', 'download', 'video', 'full'].forEach(c => {
        const btn = document.getElementById(`cat-${c}-btn`);
        if (c === cat) {
          btn.className = "py-3 px-3 rounded-2xl border-2 border-sabii-gold bg-sabii-gold/10 text-sabii-darkgold font-bold text-xs sm:text-sm flex flex-col items-center gap-1 transition shadow-sm";
        } else {
          btn.className = "py-3 px-3 rounded-2xl border border-sabii-gold/30 bg-white text-stone-600 font-bold text-xs sm:text-sm flex flex-col items-center gap-1 transition shadow-sm hover:bg-stone-50";
        }
      });

      // Update Title
      const titleEl = document.getElementById('current-category-title');
      if (cat === 'social') titleEl.innerHTML = `<i class="fa-solid fa-share-nodes text-sabii-gold"></i> Social Tasks List (Rs 0.10)`;
      if (cat === 'download') titleEl.innerHTML = `<i class="fa-solid fa-download text-sabii-gold"></i> Download Tasks List (Rs 0.30)`;
      if (cat === 'video') titleEl.innerHTML = `<i class="fa-solid fa-video text-sabii-gold"></i> Video Watch Tasks List (Rs 0.15)`;
      if (cat === 'full') titleEl.innerHTML = `<i class="fa-solid fa-star-badge text-sabii-gold"></i> Full Tasks List (Rs 0.50)`;

      renderTasks();
    };

    // Render Tasks based on active category
    function renderTasks() {
      const container = document.getElementById('tasks-container');
      container.innerHTML = "";

      // Filter tasks by category
      const filteredTasks = [];
      for (const key in allTasksData) {
        if (allTasksData[key].category === activeCategory) {
          filteredTasks.push({ id: key, ...allTasksData[key] });
        }
      }

      if (filteredTasks.length > 0) {
        filteredTasks.forEach(task => {
          const card = document.createElement('div');
          card.className = "sabii-card rounded-2xl p-5 flex flex-col justify-between space-y-4 bg-stone-50/40";
          card.innerHTML = `
            <div class="space-y-2">
              <div class="flex items-center justify-between">
                <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2.5 py-0.5 rounded-full border border-emerald-200">
                  Reward: Rs ${task.reward}
                </span>
                <span class="text-[10px] text-stone-400 font-semibold uppercase">${task.category} task</span>
              </div>
              <h4 class="text-sm font-bold text-stone-800">${task.name}</h4>
              <p class="text-xs text-stone-500">${task.description || 'Task complete karein aur proof submit karein.'}</p>
            </div>

            <div class="space-y-2 pt-2">
              <a href="${task.link}" target="_blank" class="w-full py-2.5 rounded-xl border border-sabii-gold/40 hover:bg-sabii-gold/10 text-sabii-darkgold font-bold text-xs text-center block transition shadow-sm">
                <i class="fa-solid fa-external-link-alt mr-1"></i> Open Task Link
              </a>
              <button onclick="openProofModal('${task.id}', '${task.name}', '${task.reward}')" class="w-full py-2.5 rounded-xl sabii-button font-bold text-xs uppercase tracking-wider shadow-sm">
                Submit Proof <i class="fa-solid fa-cloud-arrow-up ml-1"></i>
              </button>
            </div>
          `;
          container.appendChild(card);
        });
      } else {
        container.innerHTML = `
          <div class="col-span-full sabii-card rounded-2xl p-8 text-center text-stone-400 text-xs">
            Is category me filhal koi task available nahi hai.
          </div>
        `;
      }
    }

    // Modal Controls
    window.openProofModal = function(taskId, taskName, taskReward) {
      document.getElementById('modal-task-id').value = taskId;
      document.getElementById('modal-task-name').value = taskName;
      document.getElementById('modal-task-reward').value = taskReward;
      document.getElementById('display-task-name').innerText = taskName;
      document.getElementById('proof-file').value = "";
      document.getElementById('proof-modal').classList.remove('hidden');
    };

    window.closeProofModal = function() {
      document.getElementById('proof-modal').classList.add('hidden');
    };

    // Helper: Convert File to Base64
    function convertFileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    // Submit Proof Function
    window.submitTaskProof = async function(e) {
      e.preventDefault();
      const btn = document.getElementById('modal-submit-btn');
      const taskId = document.getElementById('modal-task-id').value;
      const taskName = document.getElementById('modal-task-name').value;
      const taskReward = parseFloat(document.getElementById('modal-task-reward').value);
      const fileInput = document.getElementById('proof-file').files[0];

      if (!fileInput) {
        showToast("Baraye meharbani screenshot select karein!", "error");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Submitting...`;

      try {
        const photoBase64 = await convertFileToBase64(fileInput);

        const subRef = push(ref(db, 'admin/taskSubmissions'));
        const subId = subRef.key;

        const submissionData = {
          id: subId,
          uid: currentUserId,
          taskId: taskId,
          taskName: taskName,
          reward: taskReward,
          category: activeCategory,
          photo: photoBase64,
          status: 'Pending', // Pending, Approved, Rejected
          rewardCredited: false,
          timestamp: new Date().toISOString()
        };

        await set(subRef, submissionData);
        await set(ref(db, `user_task_submissions/${currentUserId}/${subId}`), submissionData);

        showToast("Task proof submit ho gaya hai! Admin approval ke baad reward add ho jayega.", "success");
        closeProofModal();

      } catch (err) {
        console.error(err);
        showToast("Proof submit karte waqt masla aya!", "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Submit Proof for Review</span> <i class="fa-solid fa-paper-plane"></i>`;
      }
    };

    // Auth Observer & Real-time Sync
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "index.html";
      } else {
        currentUserId = user.uid;

        // Fetch Tasks from Admin Panel (`admin/tasks`)
        onValue(ref(db, 'admin/tasks'), (snapshot) => {
          if (snapshot.exists()) {
            allTasksData = snapshot.val();
          } else {
            allTasksData = {};
          }
          renderTasks();
        });

        // Listen to User Submissions to credit reward on approval
        onValue(ref(db, `user_task_submissions/${currentUserId}`), async (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.val();
            for (const key in data) {
              const item = data[key];

              if (item.status === 'Approved' && !item.rewardCredited && !processedApprovals.has(key)) {
                processedApprovals.add(key);

                const userRef = ref(db, 'users/' + currentUserId);
                const userSnap = await get(userRef);
                if (userSnap.exists()) {
                  const currentBal = userSnap.val().balance || 0;
                  const rewardAmount = item.reward || 0.10;

                  // Add reward to balance
                  await update(userRef, { balance: currentBal + rewardAmount });

                  // Record earning in user_earnings
                  const earnRef = push(ref(db, `user_earnings/${currentUserId}`));
                  await set(earnRef, {
                    source: `Task Reward (${item.taskName})`,
                    amount: rewardAmount,
                    timestamp: new Date().toISOString()
                  });
                }

                await update(ref(db, `user_task_submissions/${currentUserId}/${key}`), { rewardCredited: true });
                await update(ref(db, `admin/taskSubmissions/${key}`), { rewardCredited: true });

                showToast(`Mubarak ho! Admin ne task approve kar diya hai, Rs ${item.reward} aapke balance me add ho gaye hain!`, "success");
              }
            }
          }
        });
      }
    });
  </script>
</body>
</html>
