
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabii - Register & Login</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sabii: {
              gold: '#C5A059',
              lightgold: '#E5D3B3',
              darkgold: '#A37F38',
              accent: '#D4AF37',
              bg: '#FAF9F6',
            }
          },
          fontFamily: {
            brand: ['Cormorant Garamond', 'serif'],
            sans: ['Montserrat', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #FAF9F6;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
    }

    .sabii-card {
      background: #FFFFFF;
      border: 1px solid rgba(197, 160, 89, 0.25);
      box-shadow: 0 15px 35px rgba(197, 160, 89, 0.08), 0 5px 15px rgba(0, 0, 0, 0.02);
    }

    .sabii-gold-text {
      background: linear-gradient(135deg, #A37F38 0%, #C5A059 50%, #D4AF37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sabii-button {
      background: linear-gradient(135deg, #C5A059 0%, #D4AF37 50%, #A37F38 100%);
      background-size: 200% auto;
      transition: all 0.3s ease;
      color: #FFFFFF;
    }

    .sabii-button:hover {
      background-position: right center;
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(197, 160, 89, 0.35);
    }

    .sabii-input {
      background: #FFFFFF;
      border: 1px solid rgba(197, 160, 89, 0.3);
      transition: all 0.3s ease;
    }

    .sabii-input:focus {
      border-color: #C5A059;
      box-shadow: 0 0 8px rgba(197, 160, 89, 0.25);
      outline: none;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #FAF9F6; }
    ::-webkit-scrollbar-thumb { background: #C5A059; border-radius: 10px; }
  </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-6 relative overflow-x-hidden">

  <!-- Background Accents -->
  <div class="fixed top-[-80px] left-[-80px] w-80 h-80 bg-sabii-lightgold/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed bottom-[-80px] right-[-80px] w-80 h-80 bg-sabii-gold/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Toast Notification -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none"></div>

  <!-- Main Card -->
  <div class="w-full max-w-3xl sabii-card rounded-3xl overflow-hidden my-auto transition-all duration-300">
    
    <!-- Sabii Brand Header -->
    <div class="p-6 sm:p-8 text-center border-b border-sabii-gold/15 bg-white">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-sabii-gold/10 border border-sabii-gold/30 text-sabii-darkgold text-xl mb-2">
        <span class="font-brand font-bold text-2xl tracking-tighter">S</span>
      </div>
      <h1 class="font-brand text-4xl sm:text-5xl font-bold sabii-gold-text tracking-wider">Sabii</h1>
      <p class="text-xs text-stone-500 font-medium tracking-widest uppercase mt-1">Official User Portal</p>
    </div>

    <!-- Navigation Tabs -->
    <div id="auth-tabs" class="flex border-b border-sabii-gold/15 bg-stone-50/50">
      <button id="tab-login-btn" onclick="switchTab('login')" class="flex-1 py-3.5 font-semibold text-xs sm:text-sm text-sabii-darkgold border-b-2 border-sabii-gold bg-white transition-all flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-to-bracket text-sabii-gold"></i> Login
      </button>
      <button id="tab-register-btn" onclick="switchTab('register')" class="flex-1 py-3.5 font-semibold text-xs sm:text-sm text-stone-400 border-b-2 border-transparent hover:text-sabii-darkgold transition-all flex items-center justify-center gap-2">
        <i class="fa-solid fa-user-plus"></i> Register (+5 Rs)
      </button>
    </div>

    <!-- Form Container -->
    <div class="p-6 sm:p-10">

      <!-- Login Form -->
      <div id="login-section" class="max-w-md mx-auto space-y-5">
        <div class="text-center mb-6">
          <h2 class="text-xl font-bold text-stone-800 font-brand">Login to Sabii</h2>
          <p class="text-xs text-stone-500">Enter your email and password to access your account</p>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-stone-700 mb-1">Email Address</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-sabii-gold"><i class="fa-solid fa-envelope"></i></span>
              <input type="email" id="login-email" required placeholder="name@example.com" class="w-full pl-10 pr-4 py-3 rounded-xl text-sm sabii-input text-stone-800">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-stone-700 mb-1">Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-sabii-gold"><i class="fa-solid fa-lock"></i></span>
              <input type="password" id="login-password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 rounded-xl text-sm sabii-input text-stone-800">
            </div>
          </div>

          <button type="submit" id="login-btn-text" class="w-full py-3.5 rounded-xl sabii-button font-bold text-xs tracking-widest uppercase mt-4 flex justify-center items-center gap-2">
            <span>Login</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>

        <div class="text-center pt-2">
          <p class="text-xs text-stone-500">Account nahi hai? 
            <button onclick="switchTab('register')" class="text-sabii-darkgold font-bold hover:underline">Register Karein</button>
          </p>
        </div>
      </div>

      <!-- Register Form -->
      <div id="register-section" class="hidden max-w-xl mx-auto space-y-5">
        <div class="text-center mb-4">
          <h2 class="text-xl font-bold text-stone-800 font-brand">Sabii Account Register Karein</h2>
          <p class="text-xs text-stone-500">Per referral <span class="text-sabii-darkgold font-bold">5 Rupees</span> earn karein!</p>
        </div>

        <form id="register-form" onsubmit="handleRegister(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Name -->
          <div>
            <label class="block text-xs font-semibold text-stone-700 mb-1">Full Name</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-sabii-gold"><i class="fa-solid fa-user"></i></span>
              <input type="text" id="reg-fullname" required placeholder="Apna Naami Likhein" class="w-full pl-10 pr-4 py-2.5 rounded-xl text-sm sabii-input text-stone-800">
            </div>
          </div>

          <!-- Username -->
          <div>
            <label class="block text-xs font-semibold text-stone-700 mb-1">Username (Unique)</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-sabii-gold"><i class="fa-solid fa-at"></i></span>
              <input type="text" id="reg-username" required placeholder="username" class="w-full pl-10 pr-4 py-2.5 rounded-xl text-sm sabii-input text-stone-800">
            </div>
          </div>

          <!-- Phone Number -->
          <div>
            <label class="block text-xs font-semibold text-stone-700 mb-1">Mobile Number</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-sabii-gold"><i class="fa-solid fa-phone"></i></span>
              <input type="tel" id="reg-phone" required placeholder="03001234567" class="w-full pl-10 pr-4 py-2.5 rounded-xl text-sm sabii-input text-stone-800">
            </div>
          </div>

          <!-- City -->
          <div>
            <label class="block text-xs font-semibold text-stone-700 mb-1">City</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-sabii-gold"><i class="fa-solid fa-city"></i></span>
              <input type="text" id="reg-city" required placeholder="City" class="w-full pl-10 pr-4 py-2.5 rounded-xl text-sm sabii-input text-stone-800">
            </div>
          </div>

          <!-- Email -->
          <div>
            <label class="block text-xs font-semibold text-stone-700 mb-1">Email Address</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-sabii-gold"><i class="fa-solid fa-envelope"></i></span>
              <input type="email" id="reg-email" required placeholder="email@example.com" class="w-full pl-10 pr-4 py-2.5 rounded-xl text-sm sabii-input text-stone-800">
            </div>
          </div>

          <!-- Password -->
          <div>
            <label class="block text-xs font-semibold text-stone-700 mb-1">Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-sabii-gold"><i class="fa-solid fa-lock"></i></span>
              <input type="password" id="reg-password" minlength="6" required placeholder="Min 6 characters" class="w-full pl-10 pr-4 py-2.5 rounded-xl text-sm sabii-input text-stone-800">
            </div>
          </div>

          <!-- Referral Code -->
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-stone-700 mb-1">Referral Code / Referrer Username <span class="text-stone-400 font-normal">(Optional)</span></label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-sabii-gold"><i class="fa-solid fa-user-tag"></i></span>
              <input type="text" id="reg-referral" placeholder="Referral Code ya Username enter karein" class="w-full pl-10 pr-4 py-2.5 rounded-xl text-sm sabii-input text-stone-800">
            </div>
          </div>

          <!-- Submit Button -->
          <div class="md:col-span-2 mt-2">
            <button type="submit" id="reg-btn-text" class="w-full py-3.5 rounded-xl sabii-button font-bold text-xs tracking-widest uppercase flex justify-center items-center gap-2">
              <span>Register Account</span>
              <i class="fa-solid fa-user-check"></i>
            </button>
          </div>
        </form>

        <div class="text-center pt-2">
          <p class="text-xs text-stone-500">Pehle se registered hain? 
            <button onclick="switchTab('login')" class="text-sabii-darkgold font-bold hover:underline">Login Karein</button>
          </p>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="p-4 text-center border-t border-sabii-gold/15 bg-white text-[11px] text-stone-400">
      &copy; Sabii Application. Powered by Firebase Realtime Database.
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getDatabase, 
      ref, 
      set, 
      get, 
      update
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyC0ufsDkglGIXuU8Tj3wg4-yexoI6oxBm4",
      authDomain: "sabi-3ea84.firebaseapp.com",
      projectId: "sabi-3ea84",
      storageBucket: "sabi-3ea84.firebasestorage.app",
      messagingSenderId: "124632688151",
      appId: "1:124632688151:web:b4804b0cc7f301d30d9e52",
      measurementId: "G-837LHT24Y3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Toast Alert Function
    window.showToast = function(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      const bgColor = type === 'success' 
        ? 'bg-stone-900 border-sabii-gold text-sabii-lightgold' 
        : 'bg-red-900 border-red-500 text-white';

      toast.className = `p-3.5 rounded-xl border ${bgColor} shadow-xl text-xs font-semibold flex items-center justify-between gap-3 pointer-events-auto transform translate-y-[-10px] opacity-0 transition-all duration-300`;
      
      const icon = type === 'success' ? '<i class="fa-solid fa-circle-check text-sabii-gold text-base"></i>' : '<i class="fa-solid fa-triangle-exclamation text-red-400 text-base"></i>';

      toast.innerHTML = `
        <div class="flex items-center gap-2">
          ${icon}
          <span>${message}</span>
        </div>
        <button onclick="this.parentElement.remove()" class="opacity-70 hover:opacity-100"><i class="fa-solid fa-xmark"></i></button>
      `;

      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.remove('translate-y-[-10px]', 'opacity-0');
      }, 10);

      setTimeout(() => {
        toast.classList.add('opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    };

    // Tab Switch Function
    window.switchTab = function(tab) {
      const loginSec = document.getElementById('login-section');
      const regSec = document.getElementById('register-section');
      const loginBtn = document.getElementById('tab-login-btn');
      const regBtn = document.getElementById('tab-register-btn');

      if (tab === 'login') {
        loginSec.classList.remove('hidden');
        regSec.classList.add('hidden');
        loginBtn.className = "flex-1 py-3.5 font-semibold text-xs sm:text-sm text-sabii-darkgold border-b-2 border-sabii-gold bg-white transition-all flex items-center justify-center gap-2";
        regBtn.className = "flex-1 py-3.5 font-semibold text-xs sm:text-sm text-stone-400 border-b-2 border-transparent hover:text-sabii-darkgold transition-all flex items-center justify-center gap-2";
      } else {
        regSec.classList.remove('hidden');
        loginSec.classList.add('hidden');
        regBtn.className = "flex-1 py-3.5 font-semibold text-xs sm:text-sm text-sabii-darkgold border-b-2 border-sabii-gold bg-white transition-all flex items-center justify-center gap-2";
        loginBtn.className = "flex-1 py-3.5 font-semibold text-xs sm:text-sm text-stone-400 border-b-2 border-transparent hover:text-sabii-darkgold transition-all flex items-center justify-center gap-2";
      }
    };

    // Referral Query Link Handler
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const refCode = urlParams.get('ref');
      if (refCode) {
        document.getElementById('reg-referral').value = refCode;
        switchTab('register');
      }
    });

    // Check Duplicate Username
    async function isUsernameTaken(username) {
      const usersRef = ref(db, 'users');
      const snapshot = await get(usersRef);
      if (!snapshot.exists()) return false;
      let taken = false;
      snapshot.forEach((child) => {
        if (child.val().username && child.val().username.toLowerCase() === username.toLowerCase()) {
          taken = true;
        }
      });
      return taken;
    }

    // Find Referrer in Database
    async function findReferrer(refInput) {
      if (!refInput) return null;
      const cleanInput = refInput.trim().toLowerCase();
      const usersRef = ref(db, 'users');
      const snapshot = await get(usersRef);

      if (!snapshot.exists()) return null;

      let referrerKey = null;
      let referrerData = null;

      snapshot.forEach((childSnap) => {
        const val = childSnap.val();
        if (
          (val.referralCode && val.referralCode.toLowerCase() === cleanInput) ||
          (val.username && val.username.toLowerCase() === cleanInput)
        ) {
          referrerKey = childSnap.key;
          referrerData = val;
        }
      });

      return referrerKey ? { uid: referrerKey, data: referrerData } : null;
    }

    // Handle Registration
    window.handleRegister = async function(e) {
      e.preventDefault();
      const btn = document.getElementById('reg-btn-text');
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Registering...`;
      btn.disabled = true;

      const name = document.getElementById('reg-fullname').value.trim();
      const username = document.getElementById('reg-username').value.trim().toLowerCase();
      const phone = document.getElementById('reg-phone').value.trim();
      const city = document.getElementById('reg-city').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const refInput = document.getElementById('reg-referral').value.trim();

      try {
        const usernameExists = await isUsernameTaken(username);
        if (usernameExists) {
          showToast('Yeh username pehle se istemal me hai!', 'error');
          btn.innerHTML = `<span>Register Account</span> <i class="fa-solid fa-user-check"></i>`;
          btn.disabled = false;
          return;
        }

        let referrer = null;
        if (refInput) {
          referrer = await findReferrer(refInput);
          if (!referrer) {
            showToast('Invalid Referral Code ya Username.', 'error');
            btn.innerHTML = `<span>Register Account</span> <i class="fa-solid fa-user-check"></i>`;
            btn.disabled = false;
            return;
          }
        }

        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const uid = userCredential.user.uid;

        const autoRefCode = 'SABII-' + Math.random().toString(36).substring(2, 7).toUpperCase();

        const userData = {
          name: name,
          username: username,
          phone: phone,
          city: city,
          email: email,
          referralCode: autoRefCode,
          referredBy: referrer ? referrer.data.username : 'Direct',
          balance: 0,
          totalReferrals: 0,
          createdAt: new Date().toISOString()
        };

        await set(ref(db, 'users/' + uid), userData);

        if (referrer) {
          const currentBal = referrer.data.balance || 0;
          const currentCount = referrer.data.totalReferrals || 0;
          
          await update(ref(db, 'users/' + referrer.uid), {
            balance: currentBal + 5,
            totalReferrals: currentCount + 1
          });
        }

        showToast('Sabii par registration kamyab ho gayi!', 'success');
        
        // Direct redirect to dashboard.html
        window.location.href = "dashboard.html";

      } catch (err) {
        console.error(err);
        let errorMsg = err.message;
        if (err.code === 'auth/email-already-in-use') {
          errorMsg = 'Yeh email pehle se registered hai! Aap login karein.';
        }
        showToast(errorMsg, 'error');
        btn.innerHTML = `<span>Register Account</span> <i class="fa-solid fa-user-check"></i>`;
        btn.disabled = false;
      }
    };

    // Handle Login
    window.handleLogin = async function(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn-text');
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Login Ho Raha Hai...`;
      btn.disabled = true;

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        showToast('Login Kamyab!', 'success');
        
        // Direct redirect to dashboard.html
        window.location.href = "dashboard.html";
      } catch (err) {
        console.error(err);
        showToast('Galat Email ya Password.', 'error');
        btn.innerHTML = `<span>Login</span> <i class="fa-solid fa-arrow-right"></i>`;
        btn.disabled = false;
      }
    };

    // Auth state observer
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Agar user pehle se logged in hai to direct dashboard.html bhej dein
        window.location.href = "dashboard.html";
      }
    });
  </script>
</body>
</html>
